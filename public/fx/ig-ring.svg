<svg xmlns="http://www.w3.org/2000/svg" width="340" height="86" viewBox="0 0 340 86" preserveAspectRatio="none">
  <!-- Pill-shaped pink/purple ring with a soft glow baked in. Sized for a ~300x46 button with 20px of bleed. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5795"/>
      <stop offset="0.5" stop-color="#9066d2"/>
      <stop offset="1" stop-color="#ff5795"/>
    </linearGradient>
    <filter id="b" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect x="19" y="19" width="302" height="48" rx="24" fill="none" stroke="url(#g)" stroke-width="6" stroke-opacity="0.7" filter="url(#b)"/>
  <rect x="19" y="19" width="302" height="48" rx="24" fill="none" stroke="url(#g)" stroke-width="1.5"/>
</svg>
